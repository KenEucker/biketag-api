name: Release
on:
  push:
    branches:
      - production

permissions:
  contents: read # for checkout

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          node-version: '24'
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
      - name: Install dependencies
        run: npm clean-install
      - name: Build
        run: npm run build
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Run lint, tests, and other verification
        run: npm test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm clean-install
      - name: Install release Git plugin
        run: npm install --no-save --package-lock=false --ignore-scripts @semantic-release/git@10.0.1
      - name: Build
        run: npm run build
      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: npm audit signatures
      - name: Debug npm identity
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_REF=$GITHUB_REF"
          node -p "'package=' + require('./package.json').name"
          npm view "$(node -p "require('./package.json').name")" version --registry=https://registry.npmjs.org/
      - name: Record production revision before release
        run: echo "BEFORE_RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Sync published version to develop
        run: |
          set -euo pipefail
          git fetch origin production develop
          AFTER_RELEASE_SHA=$(git rev-parse origin/production)
          if [ "$AFTER_RELEASE_SHA" = "$BEFORE_RELEASE_SHA" ]; then
            echo 'No release commit was created; skipping develop synchronization.'
            exit 0
          fi
          RELEASE_COMMIT_SUBJECT=$(git log -1 --format=%s origin/production)
          if [[ ! "$RELEASE_COMMIT_SUBJECT" =~ ^chore\(release\):[[:space:]] ]]; then
            echo 'Production advanced without an expected release commit; refusing to synchronize.' >&2
            exit 1
          fi
          RELEASE_VERSION=$(git show origin/production:package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          git switch -C develop origin/develop
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Develop manifests already match the released version.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore(release): sync ${RELEASE_VERSION} to develop [skip ci]"
          git push origin HEAD:develop
